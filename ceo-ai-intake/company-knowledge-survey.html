<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Khảo sát tri thức doanh nghiệp dành cho CEO AI của Feline AI.">
  <title>Khảo sát tri thức doanh nghiệp</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,600&display=swap');
    :root{--ink:#18221c;--body:#47554c;--muted:#5a685f;--paper:#f5f2e9;--surface:#fffef9;--line:#d9ddd4;--green:#126146;--green-deep:#0b4935;--green-soft:#e1eee6;--orange:#d86f42;--orange-soft:#fae9df;--danger:#9b3f37;--shadow:0 22px 64px rgba(36,49,40,.11)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;color:var(--ink);background:radial-gradient(circle at 92% 4%,rgba(216,111,66,.12),transparent 30rem),radial-gradient(circle at 2% 94%,rgba(18,97,70,.11),transparent 34rem),var(--paper);font-family:Manrope,sans-serif;-webkit-font-smoothing:antialiased}
    ::selection{color:#fff;background:var(--green)}*{scrollbar-color:#a8b6ac transparent;scrollbar-width:thin}button,input,textarea,select{font:inherit}button{color:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid rgba(216,111,66,.38);outline-offset:3px}
    .page{width:min(1240px,calc(100% - 40px));margin:0 auto;padding:28px 0 52px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:28px}.brand{display:flex;align-items:center;gap:11px;font-weight:800}.brand-mark{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;color:#fff;background:var(--green);box-shadow:0 8px 20px rgba(18,97,70,.24)}.brand-mark svg{width:20px;height:20px}.top-actions{display:flex;align-items:center;gap:15px}.switch-link{color:var(--green-deep);font-size:12px;font-weight:800;text-underline-offset:4px}.save{color:var(--muted);font-size:12px}
    .workspace{display:grid;grid-template-columns:306px minmax(0,1fr);gap:38px;align-items:start;min-width:0}.sidebar{position:sticky;top:22px}.sidebar h1{max-width:10ch;margin:0 0 14px;font:600 clamp(39px,4.5vw,60px)/.96 Newsreader,serif;letter-spacing:-.035em}.intro{max-width:34ch;margin:0 0 18px;color:var(--body);font-size:14px;line-height:1.68}.time{display:flex;align-items:center;gap:8px;width:fit-content;margin-bottom:24px;padding:7px 11px;border-radius:99px;color:var(--green-deep);background:var(--green-soft);font-size:12px;font-weight:800}.time svg{width:15px;height:15px}.steps{display:grid;gap:4px}.step-link{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;width:100%;padding:8px;border:0;border-radius:12px;color:var(--muted);background:transparent;text-align:left;cursor:pointer}.step-link:hover{background:rgba(255,255,255,.55)}.step-link[aria-current="step"]{color:var(--ink);background:var(--surface)}.step-index{display:grid;place-items:center;width:28px;height:28px;border:1px solid var(--line);border-radius:50%;font-size:12px;font-weight:800}.step-link[aria-current="step"] .step-index{color:#fff;border-color:var(--green);background:var(--green)}.step-link.is-done .step-index{color:var(--green);border-color:var(--green);background:var(--green-soft)}.step-label{font-size:12px;font-weight:700}.progress{height:5px;margin-top:22px;overflow:hidden;border-radius:99px;background:#e3e2d9}.progress-bar{height:100%;background:var(--orange);transition:width .34s ease}
    .survey{min-width:0;overflow:hidden;border-radius:24px;background:var(--surface);box-shadow:var(--shadow)}.survey-head{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;padding:34px 40px 24px;border-bottom:1px solid var(--line)}.survey-head h2{margin:0 0 7px;font-size:clamp(25px,3vw,35px);letter-spacing:-.03em}.survey-head p{max-width:68ch;margin:0;color:var(--body);font-size:14px;line-height:1.6}.chip{flex:none;padding:7px 11px;border-radius:99px;color:var(--green-deep);background:var(--green-soft);font-size:12px;font-weight:800}.survey-body{min-height:610px;padding:28px 40px 40px}.question{min-width:0;padding:4px 0 29px}.question+.question{padding-top:29px;border-top:1px solid var(--line)}.question h3{margin:0 0 6px;font-size:16px;letter-spacing:-.012em}.help{max-width:72ch;margin:0 0 16px;color:var(--muted);font-size:13px;line-height:1.55}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.choices.compact{grid-template-columns:repeat(3,minmax(0,1fr))}.choice{position:relative;min-width:0}.choice input{position:absolute;opacity:0;pointer-events:none}.choice label{display:block;height:100%;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;transition:border-color .18s ease,background .18s ease,transform .18s ease}.choice label:hover{border-color:#aab8ae;transform:translateY(-1px)}.choice input:focus-visible+label{outline:3px solid rgba(216,111,66,.38);outline-offset:2px}.choice input:checked+label{border-color:var(--green);background:var(--green-soft)}.choice-title{display:block;font-size:13px;font-weight:800}.choice-copy{display:block;margin-top:3px;color:var(--muted);font-size:12px;line-height:1.45}.detail-prompt{display:block;margin:15px 0 7px;color:var(--ink);font-size:12px;font-weight:800}.field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field-wrap{display:grid;min-width:0;gap:7px}.field-wrap label{font-size:12px;font-weight:800}.field{width:100%;min-width:0;min-height:46px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;color:var(--ink);background:#fff}.field::placeholder{color:#647168}textarea.field{min-height:104px;resize:vertical;line-height:1.55}.required{color:var(--danger)}.field.is-invalid{border-color:var(--danger);background:#fff9f8}.guidance{display:flex;gap:12px;margin-bottom:24px;padding:15px 16px;border-radius:14px;color:#59362b;background:var(--orange-soft);font-size:13px;line-height:1.55}.guidance svg{flex:none;width:19px;height:19px;margin-top:1px}.guidance strong{display:block;margin-bottom:2px}.review{display:grid;gap:18px}.review-block{padding-bottom:18px;border-bottom:1px solid var(--line)}.review-block:last-child{border-bottom:0}.review-block h3{margin:0 0 9px;font-size:14px}.review-list{display:grid;gap:7px;margin:0;padding:0;list-style:none}.review-list li{display:flex;gap:9px;color:var(--body);font-size:13px;line-height:1.5}.mark{flex:none;display:grid;place-items:center;width:19px;height:19px;margin-top:1px;border-radius:50%;color:var(--green-deep);background:var(--green-soft);font-size:12px;font-weight:900}.completion{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:22px;padding:16px 18px;border-radius:14px;background:var(--green-soft)}.completion strong{font-size:14px}.completion span{color:var(--green-deep);font-size:13px;font-weight:800}.actions{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:22px 40px;border-top:1px solid var(--line);background:#fbfaf5}.action-set{display:flex;gap:10px}.button{min-height:44px;padding:0 17px;border:1px solid transparent;border-radius:12px;font-weight:800;cursor:pointer}.button:hover{transform:translateY(-1px)}.button:disabled{opacity:.42;cursor:not-allowed;transform:none}.primary{color:#fff;background:var(--green);box-shadow:0 8px 18px rgba(18,97,70,.19)}.primary:hover{background:var(--green-deep)}.secondary{border-color:var(--line);background:#fff}.quiet{padding-inline:8px;color:var(--muted);background:transparent}.toast{position:fixed;right:24px;bottom:24px;z-index:10;padding:13px 16px;border-radius:12px;color:#fff;background:var(--ink);box-shadow:var(--shadow);font-size:13px;font-weight:700;opacity:0;transform:translateY(12px);pointer-events:none;transition:.22s ease}.toast.show{opacity:1;transform:translateY(0)}
    @media(max-width:900px){.page{width:min(100% - 24px,740px);padding-top:18px}.workspace{grid-template-columns:1fr;gap:18px}.sidebar{position:static}.sidebar h1{max-width:14ch;font-size:41px}.intro{max-width:62ch}.steps{grid-template-columns:repeat(9,minmax(0,1fr));gap:2px}.step-link{place-items:center;min-width:0;padding:3px}.step-label{display:none}.progress{margin-top:12px}.survey{border-radius:20px}.survey-head,.survey-body,.actions{padding-left:22px;padding-right:22px}.choices.compact{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:600px){.top-actions{align-items:flex-end;flex-direction:column;gap:4px}.save{display:none}.survey-head{padding-top:24px}.survey-head h2{font-size:27px}.chip{display:none}.choices,.choices.compact,.field-grid{grid-template-columns:1fr}.actions{flex-direction:column-reverse;align-items:stretch}.action-set{display:grid;grid-template-columns:1fr 1fr}.button{width:100%}.completion{align-items:flex-start;flex-direction:column;gap:5px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M6.8 16.4c1.3-3.7 3.7-6.5 7.8-8.8M9.1 19c3.2-.9 6.5-3.4 8.6-7.6M5 11.4c1.2.3 2.2.9 2.9 1.8M14.3 5c.6 1.1.8 2.2.6 3.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>Feline AI</div>
      <div class="top-actions"><a class="switch-link" href="/leadership-survey">Khảo sát phong cách điều hành</a><span class="save" id="saveState">Tự động lưu trên thiết bị này</span></div>
    </header>
    <div class="workspace">
      <aside class="sidebar">
        <h1>Tri thức thật của doanh nghiệp.</h1>
        <p class="intro">Chọn những gì đang áp dụng, sau đó ghi rõ cách công ty đang làm. Có thể chia link này cho CEO, HR, Kế toán và trưởng bộ phận điền riêng.</p>
        <div class="time"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.7"/><path d="M12 7.5v5l3 1.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>Khoảng 35–50 phút</div>
        <nav class="steps" id="stepNav" aria-label="Các phần khảo sát"></nav>
        <div class="progress" aria-hidden="true"><div class="progress-bar" id="progressBar"></div></div>
      </aside>
      <section class="survey">
        <header class="survey-head"><div><h2 id="sectionTitle"></h2><p id="sectionDescription"></p></div><span class="chip" id="stepChip"></span></header>
        <form id="surveyForm" novalidate>
          <div class="survey-body" id="surveyBody"></div>
          <footer class="actions"><button class="button quiet" type="button" id="resetButton">Làm lại</button><div class="action-set"><button class="button secondary" type="button" id="backButton">Quay lại</button><button class="button primary" type="button" id="nextButton">Tiếp tục</button></div></footer>
        </form>
      </section>
    </div>
  </main>
  <div class="toast" id="toast" role="status"></div>
  <script>
    const sections=[
      {short:'Thông tin',title:'Ai đang cung cấp tri thức?',description:'Xác định phạm vi chuyên môn và người chịu trách nhiệm xác nhận nội dung.',questions:[
        {id:'identity',type:'fields',fields:[['respondentName','Họ và tên','Tên người trả lời',true],['respondentTitle','Chức danh','Chức danh hiện tại',true],['companyName','Công ty','Tên công ty',true],['departmentName','Phòng ban','Ví dụ: Nhân sự, Kế toán',true],['contactInfo','Email hoặc số điện thoại','Thông tin liên hệ',false],['answerDate','Ngày trả lời','',false,'date']]},
        {id:'knowledgeScope',type:'hybridMulti',title:'Bạn có thể xác nhận những nhóm tri thức nào?',help:'Chọn tất cả phạm vi bạn trực tiếp phụ trách hoặc có thể xác nhận.',options:['Cơ cấu tổ chức','Nhân sự và chấm công','Tài chính nội bộ','Mua sắm và vận hành','Bán hàng và khách hàng','Công nghệ và dữ liệu','Pháp lý và tuân thủ','Chiến lược và mục tiêu'],detailLabel:'Phạm vi nào bạn chịu trách nhiệm cuối cùng? Có phần nào chỉ biết để tham khảo?',placeholder:'Ví dụ: Tôi xác nhận chính sách nhân sự; hạn mức chi phí cần Kế toán trưởng xác nhận.'},
        {id:'authorityLevel',type:'hybridSingle',title:'Mức độ xác nhận của câu trả lời này',options:['Người ban hành hoặc quyết định cuối','Chủ sở hữu quy trình','Người trực tiếp thực hiện','Người phối hợp','Chỉ cung cấp thông tin tham khảo'],detailLabel:'Ai cần duyệt lại nội dung trước khi đưa vào Knowledge Hub?',placeholder:'Tên người hoặc chức danh; ghi “không cần” nếu bạn có quyền xác nhận.'}
      ]},
      {short:'Tổ chức',title:'Cơ cấu và người chịu trách nhiệm',description:'Giúp CEO AI biết đúng người, đúng cấp và đúng phạm vi khi hướng dẫn hoặc chuyển xử lý.',questions:[
        {id:'departments',type:'hybridMulti',title:'Công ty hiện có những phòng ban hoặc nhóm nào?',options:['Ban Giám đốc','Nhân sự','Kế toán/Tài chính','Vận hành','Sản xuất/Xưởng','Kinh doanh','Chăm sóc khách hàng','Marketing','Công nghệ','Pháp chế','Mua sắm'],detailLabel:'Ghi tên chính thức, người đứng đầu và chức năng chính của từng bộ phận.',placeholder:'Ví dụ: Nhân sự — Nguyễn A — hồ sơ nhân viên, chấm công, nghỉ phép...'},
        {id:'reportingLines',type:'hybridSingle',title:'Quan hệ báo cáo đang được quản lý như thế nào?',options:['Có sơ đồ tổ chức chính thức','Có danh sách nhưng chưa thành sơ đồ','Theo thực tế vận hành, chưa có tài liệu','Thay đổi thường xuyên','Chưa xác định rõ'],detailLabel:'Mô tả ai báo cáo cho ai và cấp nào có quyền giao việc hoặc đánh giá.',placeholder:'Nêu các tuyến báo cáo quan trọng và ngoại lệ.'},
        {id:'processOwners',type:'hybridMulti',title:'Những đầu mối nào nhân viên thường cần tìm?',options:['Chấm công/nghỉ phép','Hồ sơ nhân sự','Lương/thưởng','Tạm ứng/hoàn ứng','Mua sắm','Thiết bị/công nghệ','Khiếu nại nội bộ','Khách hàng','Pháp lý/hợp đồng'],detailLabel:'Với từng mục đã chọn, ai là người xử lý chính, người thay thế và kênh liên hệ?',placeholder:'Ví dụ: Quên chấm công → HR Admin; vắng mặt → HR Manager; kênh: form nội bộ.'},
        {id:'handoverRules',type:'hybridSingle',title:'Khi người phụ trách vắng mặt thì xử lý thế nào?',options:['Có người thay thế cố định','Manager cấp trên nhận xử lý','Chuyển sang đầu mối chung','Đợi người phụ trách quay lại','Tùy từng trường hợp'],detailLabel:'Ghi rõ người thay thế hoặc nguyên tắc chuyển tiếp và thời gian được phép chờ.',placeholder:'Ví dụ: Sau 4 giờ chưa phản hồi thì chuyển trưởng bộ phận.'}
      ]},
      {short:'Nhân sự',title:'Nhân sự, chấm công và nghỉ phép',description:'Thu thập quy định đang áp dụng, không chỉ tên tài liệu hoặc lựa chọn chung.',questions:[
        {id:'workingTime',type:'hybridMulti',title:'Công ty đang áp dụng những hình thức làm việc nào?',options:['Giờ hành chính','Theo ca','Linh hoạt giờ vào/ra','Làm từ xa','Hybrid','Làm thêm giờ','Làm cuối tuần/ngày lễ'],detailLabel:'Ghi giờ làm, ngày làm, cách xếp ca, cách đổi ca và quy định làm thêm.',placeholder:'Nêu con số, mốc thời gian và người xác nhận nếu có.'},
        {id:'attendance',type:'hybridMulti',title:'Các tình huống chấm công thường gặp',options:['Quên chấm công','Đi muộn','Về sớm','Sai ca','Làm từ xa','Đi công tác','Máy chấm công lỗi','Làm thêm giờ'],detailLabel:'Mỗi tình huống cần báo cho ai, trong bao lâu, cần bằng chứng gì và ai duyệt sửa?',placeholder:'Ví dụ: Quên chấm công phải gửi form trong ngày, quản lý trực tiếp xác nhận.'},
        {id:'leavePolicy',type:'hybridMulti',title:'Các loại nghỉ hiện đang áp dụng',options:['Phép năm','Nghỉ ốm','Nghỉ không lương','Nghỉ cưới/tang','Nghỉ thai sản','Nghỉ bù','Nghỉ khẩn cấp','Nghỉ theo ca'],detailLabel:'Ghi số ngày, cách tính phép, thời gian báo trước, người duyệt và quy tắc bàn giao.',placeholder:'Mỗi loại nghỉ một dòng. Nếu chưa có quy định, ghi rõ cách đang xử lý thực tế.'},
        {id:'employeePerformance',type:'hybridMulti',title:'Công ty quản lý hiệu suất và vi phạm bằng cách nào?',options:['KPI/OKR','Đánh giá định kỳ','Phản hồi 1-1','Cam kết cải thiện','Nhắc nhở bằng văn bản','Kỷ luật theo cấp','Thưởng theo kết quả','Chưa có quy trình thống nhất'],detailLabel:'Mô tả chu kỳ, tiêu chí, người đánh giá, quyền phản hồi và các bước khi kết quả thấp.',placeholder:'Không cần ghi dữ liệu cá nhân; chỉ mô tả quy trình và thẩm quyền.'},
        {id:'hrSensitiveAccess',type:'hybridMulti',title:'Những dữ liệu nhân sự nào cần hạn chế?',options:['Lương/thưởng','Hợp đồng lao động','CCCD/hộ chiếu','Tài khoản ngân hàng','Đánh giá hiệu suất','Kỷ luật/khiếu nại','Sức khỏe','Kế hoạch nhân sự'],detailLabel:'Ai được xem từng nhóm dữ liệu? Manager được xem đến mức nào? Có cần che bớt trường nào?',placeholder:'Nêu theo vai trò hoặc chức danh, không nhập dữ liệu cá nhân thật.'}
      ]},
      {short:'Tài chính',title:'Tạm ứng, hoàn ứng và chi phí',description:'Làm rõ hồ sơ, hạn mức, thẩm quyền và ngoại lệ để CEO AI không tư vấn chung chung.',questions:[
        {id:'advanceRules',type:'hybridMulti',title:'Yêu cầu tạm ứng cần những gì?',options:['Mục đích','Số tiền','Ngày cần','Thời hạn hoàn ứng','Cost center','Người quản lý xác nhận','Kế hoạch sử dụng','Chứng từ dự kiến'],detailLabel:'Ghi hạn mức, người kiểm tra, người duyệt, thời gian xử lý và trường hợp bị từ chối.',placeholder:'Nếu hạn mức khác nhau theo chức danh hoặc bộ phận, ghi rõ từng mức.'},

      {short:'Hoàn tất',title:'Kiểm tra và tải kết quả',description:'Kết quả được xuất thành Markdown riêng để rà soát trước khi đưa vào Knowledge Hub.',review:true,questions:[]}
    ];
    const form=document.getElementById('surveyForm'),body=document.getElementById('surveyBody'),nav=document.getElementById('stepNav'),title=document.getElementById('sectionTitle'),description=document.getElementById('sectionDescription'),chip=document.getElementById('stepChip'),progress=document.getElementById('progressBar'),back=document.getElementById('backButton'),next=document.getElementById('nextButton'),reset=document.getElementById('resetButton'),saveState=document.getElementById('saveState'),toast=document.getElementById('toast');
    const storageKey='feline-company-knowledge-survey-v1';let step=0,timer,firstRender=true;
    function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]))}
    function showToast(message){clearTimeout(timer);toast.textContent=message;toast.classList.add('show');timer=setTimeout(()=>toast.classList.remove('show'),2300)}
    function saved(){try{return JSON.parse(localStorage.getItem(storageKey)||'{}')}catch{return {}}}
    function currentValues(){const d=new FormData(form),r={};for(const[k,v]of d.entries()){if(r[k])r[k]=Array.isArray(r[k])?[...r[k],v]:[r[k],v];else r[k]=v}return r}
    function values(){const result=saved(),current=currentValues(),visible=new Set([...body.querySelectorAll('[name]')].map(el=>el.name));visible.forEach(name=>delete result[name]);return Object.assign(result,current)}
    function persist(){localStorage.setItem(storageKey,JSON.stringify(values()));saveState.textContent='Đã lưu lúc '+new Date().toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'})}
    function optionMarkup(q,option,index){const tuple=Array.isArray(option)?option:[option,option,''];const[value,label,copy]=tuple,id=`${q.id}-${index}`,multi=q.type==='hybridMulti';return `<div class="choice"><input type="${multi?'checkbox':'radio'}" id="${id}" name="${q.id}" value="${esc(value)}"><label for="${id}"><span class="choice-title">${esc(label)}</span>${copy?`<span class="choice-copy">${esc(copy)}</span>`:''}</label></div>`}
    function questionMarkup(q){
      if(q.type==='fields')return `<div class="question"><div class="field-grid">${q.fields.map(([id,label,placeholder,required,type='text'])=>`<div class="field-wrap"><label for="${id}">${label}${required?' <span class="required">*</span>':''}</label><input class="field" id="${id}" name="${id}" type="${type}" placeholder="${placeholder}" ${required?'required':''}></div>`).join('')}</div></div>`;
      if(q.type==='textarea')return `<div class="question"><h3>${q.title}</h3>${q.help?`<p class="help">${q.help}</p>`:''}<textarea class="field" name="${q.id}" rows="5" placeholder="${q.placeholder||''}"></textarea></div>`;
      return `<div class="question"><h3>${q.title}</h3>${q.help?`<p class="help">${q.help}</p>`:''}<div class="choices ${q.options.length<=5?'compact':''}">${q.options.map((o,i)=>optionMarkup(q,o,i)).join('')}</div><label class="detail-prompt" for="${q.id}Detail">${q.detailLabel}</label><textarea class="field" id="${q.id}Detail" name="${q.id}Detail" rows="4" placeholder="${q.placeholder||''}"></textarea></div>`;
    }
    function restoreVisible(){const d=saved();body.querySelectorAll('input,textarea').forEach(input=>{const v=d[input.name];if(input.type==='checkbox'||input.type==='radio')input.checked=Array.isArray(v)?v.includes(input.value):v===input.value;else if(v!==undefined)input.value=v});const date=document.getElementById('answerDate');if(date&&!date.value)date.value=new Date().toISOString().slice(0,10)}
    function answeredCount(){const d=saved(),ids=sections.flatMap(s=>s.questions.map(q=>q.id));return{answered:ids.filter(id=>d[id]||d[`${id}Detail`]).length,total:ids.length}}
    function renderReview(){const d=saved(),count=answeredCount();const groups=sections.filter(s=>!s.review).map(s=>{const rows=s.questions.flatMap(q=>{if(q.type==='fields')return q.fields.flatMap(([id,label])=>d[id]?[`<li><span class="mark">✓</span><span><strong>${label}:</strong> ${esc(d[id])}</span></li>`]:[]);const selected=d[q.id],detail=d[`${q.id}Detail`];if(!selected&&!detail)return[];const value=Array.isArray(selected)?selected.join('; '):(selected||'Chưa chọn');return[`<li><span class="mark">✓</span><span><strong>${q.title}:</strong> ${esc(value)}${detail?`<br>${esc(detail)}`:''}</span></li>`]}).join('');return `<div class="review-block"><h3>${s.title}</h3>${rows?`<ul class="review-list">${rows}</ul>`:'<p class="help">Chưa có câu trả lời.</p>'}</div>`}).join('');body.innerHTML=`<div class="completion"><strong>Mức độ hoàn thành</strong><span>${count.answered} / ${count.total} nhóm câu hỏi</span></div><div class="guidance"><svg viewBox="0 0 24 24" fill="none"><path d="M12 8.5v4.2M12 16.2h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7"/></svg><div><strong>Kết quả là nguồn tri thức đầu vào</strong>Nội dung vẫn cần người có thẩm quyền rà soát trước khi công bố trong Knowledge Hub.</div></div><div class="review">${groups}</div><div class="question"><h3>Ghi chú cuối hoặc phần cần người khác bổ sung</h3><textarea class="field" name="finalNotes" rows="5" placeholder="Nêu phòng ban, người phụ trách hoặc nội dung còn thiếu..."></textarea></div>`;restoreVisible()}
    function render(){const s=sections[step];title.textContent=s.title;description.textContent=s.description;chip.textContent=`Phần ${step+1} / ${sections.length}`;progress.style.width=`${((step+1)/sections.length)*100}%`;nav.innerHTML=sections.map((x,i)=>`<button class="step-link ${i<step?'is-done':''}" type="button" data-go="${i}" ${i===step?'aria-current="step"':''}><span class="step-index">${i+1}</span><span class="step-label">${x.short}</span></button>`).join('');if(s.review)renderReview();else{body.innerHTML=(step===0?`<div class="guidance"><svg viewBox="0 0 24 24" fill="none"><path d="M12 8.5v4.2M12 16.2h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7"/></svg><div><strong>Không cần một người trả lời toàn bộ</strong>Mỗi trưởng bộ phận có thể mở cùng link, chọn đúng phạm vi và tải một file kết quả riêng.</div></div>`:'')+s.questions.map(questionMarkup).join('');restoreVisible()}back.disabled=step===0;next.textContent=s.review?'Tải file tri thức':'Tiếp tục';body.querySelectorAll('input,textarea').forEach(el=>el.addEventListener('input',persist));nav.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(Number(b.dataset.go))));if(!firstRender)document.querySelector('.survey').scrollIntoView({behavior:'smooth',block:'start'});firstRender=false}
    function validate(){let ok=true;body.querySelectorAll('[required]').forEach(f=>{const missing=!f.value.trim();f.classList.toggle('is-invalid',missing);if(missing)ok=false});if(!ok){body.querySelector('.is-invalid')?.focus();showToast('Vui lòng điền thông tin người trả lời')}return ok}
    function go(i){if(i>step&&!validate())return;persist();step=Math.max(0,Math.min(i,sections.length-1));render()}
    function markdown(){const d=values(),lines=[];sections.filter(s=>!s.review).forEach(s=>{lines.push(`## ${s.title}`);s.questions.forEach(q=>{if(q.type==='fields'){q.fields.forEach(([id,label])=>lines.push(`- **${label}:** ${d[id]||'Chưa trả lời'}`));return}const selected=d[q.id],value=Array.isArray(selected)?selected.join('; '):(selected||'Chưa chọn');lines.push(`### ${q.title}`);lines.push(`- **Lựa chọn:** ${value}`);if(d[`${q.id}Detail`])lines.push(`- **Mô tả thực tế:** ${d[`${q.id}Detail`]}`);lines.push('')});lines.push('')});lines.push('## Ghi chú cuối');lines.push(d.finalNotes||'Không có.');return `# Khảo sát tri thức doanh nghiệp cho CEO AI\n\n**Ngày xuất:** ${new Date().toLocaleDateString('vi-VN')}\n**Người cung cấp:** ${d.respondentName||'Chưa xác định'}\n**Phòng ban:** ${d.departmentName||'Chưa xác định'}\n\n${lines.join('\n')}\n\n---\nNội dung cần được chủ sở hữu nghiệp vụ xác nhận trước khi công bố thành tri thức chính thức.\n`}
    function download(){persist();const d=values(),name=(d.departmentName||d.respondentName||'Doanh_nghiep').replace(/[^a-zA-Z0-9À-ỹ_-]+/g,'_'),blob=new Blob([markdown()],{type:'text/markdown;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`Khao_sat_tri_thuc_${name}.md`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);showToast('Đã tải file tri thức')}
    back.addEventListener('click',()=>go(step-1));next.addEventListener('click',()=>step===sections.length-1?download():go(step+1));reset.addEventListener('click',()=>{if(!confirm('Xóa toàn bộ câu trả lời trên thiết bị này?'))return;localStorage.removeItem(storageKey);step=0;render();showToast('Đã làm mới khảo sát')});form.addEventListener('submit',e=>e.preventDefault());const requestedStep=Number(new URLSearchParams(location.search).get('step'));step=Number.isInteger(requestedStep)&&requestedStep>=0&&requestedStep<sections.length?requestedStep:0;render();
  </script>
</body>
