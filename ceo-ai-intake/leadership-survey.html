<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Khảo sát phong cách điều hành và nguyên tắc ra quyết định cho CEO AI.">
  <title>Khảo sát điều hành dành cho lãnh đạo</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,600&display=swap');
    :root {
      --ink:#18221c; --body:#47554c; --muted:#5a685f; --paper:#f5f2e9; --surface:#fffef9;
      --line:#d9ddd4; --green:#126146; --green-deep:#0b4935; --green-soft:#e1eee6;
      --orange:#d86f42; --orange-soft:#fae9df; --danger:#9b3f37; --shadow:0 22px 64px rgba(36,49,40,.11);
    }
    *{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;min-height:100vh;color:var(--ink);background:radial-gradient(circle at 92% 4%,rgba(216,111,66,.12),transparent 30rem),radial-gradient(circle at 2% 94%,rgba(18,97,70,.11),transparent 34rem),var(--paper);font-family:Manrope,sans-serif;-webkit-font-smoothing:antialiased}
    ::selection{color:#fff;background:var(--green)} *{scrollbar-color:#a8b6ac transparent;scrollbar-width:thin}
    button,input,textarea{font:inherit} button{color:inherit} button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid rgba(216,111,66,.38);outline-offset:3px}
    .page{width:min(1220px,calc(100% - 40px));margin:0 auto;padding:28px 0 48px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:28px}
    .brand{display:flex;align-items:center;gap:11px;font-weight:800}.brand-mark{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;color:#fff;background:var(--green);box-shadow:0 8px 20px rgba(18,97,70,.24)}.brand-mark svg{width:20px;height:20px}.top-actions{display:flex;align-items:center;gap:15px}.survey-switch{color:var(--green-deep);font-size:12px;font-weight:800;text-underline-offset:4px}.save{color:var(--muted);font-size:13px}
    .workspace{display:grid;grid-template-columns:300px minmax(0,1fr);gap:38px;align-items:start;min-width:0}.sidebar{position:sticky;top:22px}.sidebar h1{max-width:10ch;margin:0 0 14px;font:600 clamp(39px,4.5vw,60px)/.96 Newsreader,serif;letter-spacing:-.035em}.intro{max-width:32ch;margin:0 0 18px;color:var(--body);font-size:14px;line-height:1.68}
    .time{display:flex;align-items:center;gap:8px;width:fit-content;margin-bottom:24px;padding:7px 11px;border-radius:99px;color:var(--green-deep);background:var(--green-soft);font-size:12px;font-weight:800}.time svg{width:15px;height:15px}
    .steps{display:grid;gap:4px}.step-link{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;width:100%;padding:8px;border:0;border-radius:12px;color:var(--muted);background:transparent;text-align:left;cursor:pointer}.step-link:hover{background:rgba(255,255,255,.55)}.step-link[aria-current="step"]{color:var(--ink);background:var(--surface)}
    .step-index{display:grid;place-items:center;width:28px;height:28px;border:1px solid var(--line);border-radius:50%;font-size:12px;font-weight:800}.step-link[aria-current="step"] .step-index{color:#fff;border-color:var(--green);background:var(--green)}.step-link.is-done .step-index{color:var(--green);border-color:var(--green);background:var(--green-soft)}.step-label{font-size:12px;font-weight:700}.progress{height:5px;margin-top:22px;overflow:hidden;border-radius:99px;background:#e3e2d9}.progress-bar{width:12.5%;height:100%;background:var(--orange);transition:width .34s ease}
    .survey{min-width:0;overflow:hidden;border-radius:24px;background:var(--surface);box-shadow:var(--shadow)}.survey-head{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;padding:34px 40px 24px;border-bottom:1px solid var(--line)}.survey-head h2{margin:0 0 7px;font-size:clamp(25px,3vw,35px);letter-spacing:-.03em}.survey-head p{max-width:66ch;margin:0;color:var(--body);font-size:14px;line-height:1.6}.chip{flex:none;padding:7px 11px;border-radius:99px;color:var(--green-deep);background:var(--green-soft);font-size:12px;font-weight:800}
    .survey-body{min-height:590px;padding:28px 40px 40px}.question{min-width:0;padding:4px 0 28px}.question+.question{padding-top:28px;border-top:1px solid var(--line)}.question h3{margin:0 0 6px;font-size:16px;letter-spacing:-.012em}.help{max-width:72ch;margin:0 0 16px;color:var(--muted);font-size:13px;line-height:1.55}.limit{color:var(--green);font-weight:800}
    .choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.choices.compact{grid-template-columns:repeat(3,minmax(0,1fr))}.choice{position:relative;min-width:0}.choice input{position:absolute;opacity:0;pointer-events:none}.choice label{display:block;height:100%;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;transition:border-color .18s ease,background .18s ease,transform .18s ease}.choice label:hover{border-color:#aab8ae;transform:translateY(-1px)}.choice input:focus-visible+label{outline:3px solid rgba(216,111,66,.38);outline-offset:2px}.choice input:checked+label{border-color:var(--green);background:var(--green-soft)}.choice-title{display:block;font-size:13px;font-weight:800}.choice-copy{display:block;margin-top:3px;color:var(--muted);font-size:12px;line-height:1.45}
    .field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field-wrap{display:grid;min-width:0;gap:7px}.field-wrap label{font-size:12px;font-weight:800}.field{width:100%;min-width:0;min-height:46px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;color:var(--ink);background:#fff}.field::placeholder{color:#647168}textarea.field{min-height:96px;resize:vertical;line-height:1.55}.required{color:var(--danger)}.field.is-invalid{border-color:var(--danger);background:#fff9f8}
    .scenario{padding:18px;border:1px solid var(--line);border-radius:16px;background:#fff}.scenario+.scenario{margin-top:12px}.scenario-title{margin:0 0 7px;font-size:14px}.scenario-context{margin:0 0 14px;color:var(--body);font-size:13px;line-height:1.55}.scenario .choices{grid-template-columns:repeat(3,minmax(0,1fr))}.scenario-note{margin-top:11px}
    .notice{display:flex;gap:12px;margin-top:18px;padding:14px 16px;border-radius:14px;color:#59362b;background:var(--orange-soft);font-size:13px;line-height:1.55}.notice svg{flex:none;width:19px;height:19px;margin-top:1px}.notice strong{display:block;margin-bottom:2px}
    .review{display:grid;gap:18px}.review-block{padding-bottom:18px;border-bottom:1px solid var(--line)}.review-block:last-child{border-bottom:0}.review-block h3{margin:0 0 9px;font-size:14px}.review-list{display:grid;gap:7px;margin:0;padding:0;list-style:none}.review-list li{display:flex;gap:9px;color:var(--body);font-size:13px;line-height:1.5}.mark{flex:none;display:grid;place-items:center;width:19px;height:19px;margin-top:1px;border-radius:50%;color:var(--green-deep);background:var(--green-soft);font-size:12px;font-weight:900}.completion{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:22px;padding:16px 18px;border-radius:14px;background:var(--green-soft)}.completion strong{font-size:14px}.completion span{color:var(--green-deep);font-size:13px;font-weight:800}
    .actions{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:22px 40px;border-top:1px solid var(--line);background:#fbfaf5}.action-set{display:flex;gap:10px}.button{min-height:44px;padding:0 17px;border:1px solid transparent;border-radius:12px;font-weight:800;cursor:pointer}.button:hover{transform:translateY(-1px)}.button:disabled{opacity:.42;cursor:not-allowed;transform:none}.primary{color:#fff;background:var(--green);box-shadow:0 8px 18px rgba(18,97,70,.19)}.primary:hover{background:var(--green-deep)}.secondary{border-color:var(--line);background:#fff}.quiet{padding-inline:8px;color:var(--muted);background:transparent}
    .toast{position:fixed;right:24px;bottom:24px;z-index:10;padding:13px 16px;border-radius:12px;color:#fff;background:var(--ink);box-shadow:var(--shadow);font-size:13px;font-weight:700;opacity:0;transform:translateY(12px);pointer-events:none;transition:.22s ease}.toast.show{opacity:1;transform:translateY(0)}
    @media(max-width:880px){.page{width:min(100% - 24px,720px);padding-top:18px}.workspace{grid-template-columns:1fr;gap:18px}.sidebar{position:static;min-width:0}.sidebar h1{max-width:14ch;font-size:41px}.intro{max-width:60ch}.steps{grid-template-columns:repeat(9,minmax(0,1fr));gap:2px}.step-link{place-items:center;min-width:0;padding:3px}.step-label{display:none}.progress{margin-top:12px}.survey{border-radius:20px}.survey-head,.survey-body,.actions{padding-left:22px;padding-right:22px}.scenario .choices{grid-template-columns:1fr 1fr}}
    @media(max-width:580px){.save{display:none}.survey-head{padding-top:24px}.survey-head h2{font-size:27px}.chip{display:none}.choices,.choices.compact,.field-grid,.scenario .choices{grid-template-columns:1fr}.actions{flex-direction:column-reverse;align-items:stretch}.action-set{display:grid;grid-template-columns:1fr 1fr}.button{width:100%}.completion{align-items:flex-start;flex-direction:column;gap:5px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M6.8 16.4c1.3-3.7 3.7-6.5 7.8-8.8M9.1 19c3.2-.9 6.5-3.4 8.6-7.6M5 11.4c1.2.3 2.2.9 2.9 1.8M14.3 5c.6 1.1.8 2.2.6 3.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>Feline AI</div>
      <div class="top-actions"><a class="survey-switch" href="/company-knowledge-survey">Khảo sát tri thức doanh nghiệp</a><span class="save" id="saveState">Tự động lưu trên thiết bị này</span></div>
    </header>
    <div class="workspace">
      <aside class="sidebar">
        <h1>Cách sếp nghĩ và điều hành.</h1>
        <p class="intro">Chỉ cần chọn phương án gần đúng nhất. Không có câu trả lời đúng hoặc sai, và không cần tự viết tài liệu.</p>
        <div class="time"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.7"/><path d="M12 7.5v5l3 1.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>Khoảng 25–35 phút</div>
        <nav class="steps" id="stepNav" aria-label="Các phần khảo sát"></nav>
        <div class="progress" aria-hidden="true"><div class="progress-bar" id="progressBar"></div></div>
      </aside>
      <section class="survey">
        <header class="survey-head"><div><h2 id="sectionTitle"></h2><p id="sectionDescription"></p></div><span class="chip" id="stepChip"></span></header>
        <form id="surveyForm" novalidate>
          <div class="survey-body" id="surveyBody"></div>
          <footer class="actions"><button class="button quiet" type="button" id="resetButton">Làm lại</button><div class="action-set"><button class="button secondary" type="button" id="backButton">Quay lại</button><button class="button primary" type="button" id="nextButton">Tiếp tục</button></div></footer>
        </form>
      </section>
    </div>
  </main>
  <div class="toast" id="toast" role="status"></div>

  <script>
    const decisionOptions = [
      ['approve','Đồng ý','Có thể thực hiện ngay.'], ['more','Hỏi thêm','Cần bổ sung thông tin trước.'],
      ['delegate','Chuyển người phụ trách','Thuộc thẩm quyền hoặc chuyên môn của người khác.'],
      ['reject','Không đồng ý','Không phù hợp hoặc rủi ro quá cao.'], ['escalate','Trao đổi trực tiếp với sếp','Tình huống cần sếp quyết định.']
    ];
    const sections = [
      {
        short:'Thông tin', title:'Vai trò và phạm vi điều hành', description:'Giúp CEO AI hiểu trách nhiệm thực tế của người trả lời.',
        questions:[
          {id:'leaderName',type:'fields',fields:[['leaderName','Họ và tên','Tên người trả lời',true],['leaderTitle','Chức danh','Chức danh hiện tại',true],['companyName','Công ty','Tên công ty',false],['answerDate','Ngày trả lời','',false,'date']]},
          {id:'responsibilities',type:'multi',title:'Sếp đang trực tiếp chịu trách nhiệm những mảng nào?',help:'Chọn tất cả phạm vi đang trực tiếp quyết định hoặc chịu trách nhiệm cuối.',options:['Chiến lược và mục tiêu','Tài chính và dòng tiền','Nhân sự và văn hóa','Vận hành hằng ngày','Bán hàng và khách hàng','Sản phẩm và chất lượng','Nhà cung cấp và mua sắm','Pháp lý và tuân thủ','Công nghệ và dữ liệu','Truyền thông và thương hiệu']},
          {id:'directReports',type:'single',title:'Số người báo cáo trực tiếp cho sếp',options:['Không có','1–3 người','4–7 người','8–15 người','Trên 15 người']},
          {id:'decisionFrequency',type:'single',title:'Sếp thường phải xử lý yêu cầu nội bộ với tần suất nào?',options:['Nhiều lần mỗi ngày','Mỗi ngày','Vài lần mỗi tuần','Chủ yếu theo lịch họp','Chỉ các trường hợp đặc biệt']}
        ]
      },
      {
        short:'Ưu tiên', title:'Ưu tiên khi điều hành', description:'Xác định điều sếp bảo vệ trước tiên khi các mục tiêu xung đột.',
        questions:[
          {id:'topPriorities',type:'multi',title:'5 ưu tiên quan trọng nhất hiện tại',help:'Chọn tối đa 5 mục.',max:5,options:['Dòng tiền an toàn','Lợi nhuận','Tăng trưởng doanh thu','Tốc độ xử lý','Chất lượng sản phẩm/dịch vụ','Trải nghiệm khách hàng','Giữ người giỏi','Kỷ luật và trách nhiệm','Ổn định vận hành','Đổi mới và thử nghiệm','Tuân thủ pháp lý','Bảo mật dữ liệu','Uy tín thương hiệu','Giảm phụ thuộc vào cá nhân']},
          {id:'priorityOne',type:'text',title:'Nếu chỉ được giữ lại một ưu tiên, đó là gì?',placeholder:'Một cụm từ ngắn là đủ'},
          {id:'speedQuality',type:'single',title:'Khi tốc độ và chất lượng xung đột, sếp thường chọn',options:['Ưu tiên tốc độ, sửa dần sau','Ưu tiên chất lượng, chấp nhận chậm hơn','Tùy mức độ ảnh hưởng khách hàng','Tùy khả năng sửa sai','Luôn hỏi lại trước khi đánh đổi']},
          {id:'costPeople',type:'single',title:'Khi tiết kiệm chi phí ảnh hưởng đến con người, sếp thường',options:['Ưu tiên tiết kiệm để bảo vệ công ty','Ưu tiên ổn định đội ngũ','Cân theo mức ảnh hưởng và thời gian','Tìm phương án thứ ba trước','Trao đổi trực tiếp từng trường hợp']},
          {id:'shortLong',type:'single',title:'Khi kết quả ngắn hạn xung đột với lợi ích dài hạn',options:['Ưu tiên kết quả ngắn hạn','Ưu tiên nền tảng dài hạn','Cân theo dòng tiền hiện tại','Chia nhỏ để đạt cả hai','Không có nguyên tắc cố định']},
          {id:'customerEmployee',type:'single',title:'Khi khách hàng và nhân viên cùng có lý',options:['Ưu tiên giữ khách hàng','Ưu tiên bảo vệ nhân viên','Xem bằng chứng và mức ảnh hưởng','Manager xử lý trước','Sếp trực tiếp quyết định']}
        ]
      },
      {
        short:'Quyết định', title:'Cách sếp ra quyết định', description:'Làm rõ lượng thông tin, tốc độ và mức ủy quyền phù hợp.',
        questions:[
          {id:'requiredInputs',type:'multi',title:'Trước một quyết định quan trọng, sếp muốn thấy gì?',options:['Mục tiêu rõ ràng','Số liệu hiện tại','Chi phí dự kiến','Lợi ích dự kiến','Rủi ro và hậu quả','Các phương án thay thế','Ý kiến người chịu trách nhiệm','Tiền lệ trước đây','Tác động đến khách hàng','Tác động đến nhân sự','Thời hạn cần quyết định','Kế hoạch theo dõi sau quyết định']},
          {id:'dataConfidence',type:'single',title:'Khi dữ liệu chưa đầy đủ nhưng cần quyết định sớm',options:['Quyết ngay theo kinh nghiệm','Quyết tạm thời và đặt mốc kiểm tra','Yêu cầu thêm dữ liệu tối thiểu','Chuyển người gần vấn đề nhất quyết','Chờ đủ dữ liệu']},
          {id:'reversibleDecision',type:'single',title:'Với quyết định dễ sửa sai',options:['Cho phép tự quyết rộng','Cho thử trong phạm vi nhỏ','Vẫn cần xin phép trước','Tùy người thực hiện','Tùy chi phí/rủi ro']},
          {id:'irreversibleDecision',type:'single',title:'Với quyết định khó đảo ngược',options:['Sếp luôn duyệt trực tiếp','Yêu cầu hai người kiểm tra','Cần phương án dự phòng','Cần dữ liệu và ý kiến chuyên môn','Kết hợp tất cả điều trên']},
          {id:'consultStyle',type:'single',title:'Sếp thích nhận đề xuất theo cách nào?',options:['Một phương án tốt nhất','2–3 phương án kèm so sánh','Số liệu trước, đề xuất sau','Kết luận trước, căn cứ sau','Trao đổi miệng ngắn gọn']},
          {id:'delegation',type:'single',title:'Mức độ ủy quyền mong muốn',options:['Nhân sự tự quyết trong phạm vi công việc','Manager quyết phần lớn, chỉ báo cáo kết quả','Việc quan trọng phải xin phép trước','Ủy quyền tùy năng lực từng người','Ủy quyền nhưng cần cập nhật theo mốc']},
          {id:'followUp',type:'multi',title:'Sau khi đã quyết định, sếp muốn theo dõi điều gì?',options:['Người chịu trách nhiệm','Thời hạn hoàn thành','Chi phí thực tế','Kết quả đo được','Vấn đề phát sinh','Phản hồi của người liên quan','Bài học sau thực hiện','Chỉ báo cáo khi có vấn đề']}
        ]
      },
      {
        short:'Con người', title:'Cách quản lý và phản hồi nhân sự', description:'Giúp CEO AI phản hồi đúng tinh thần quản lý của sếp.',
        questions:[
          {id:'valuedTraits',type:'multi',title:'Sếp đánh giá cao nhất những phẩm chất nào?',max:6,help:'Chọn tối đa 6 mục.',options:['Trung thực','Chủ động','Trách nhiệm','Kỷ luật','Tốc độ','Cẩn thận','Sáng tạo','Biết phối hợp','Dám nhận sai','Tự học','Tư duy dữ liệu','Hướng đến khách hàng','Giữ cam kết','Biết ưu tiên']},
          {id:'mistakeResponse',type:'single',title:'Khi nhân viên mắc lỗi lần đầu',options:['Tập trung sửa hậu quả trước','Hỏi nguyên nhân và hướng dẫn','Yêu cầu tự đề xuất cách sửa','Nhắc nhở rõ trách nhiệm','Tùy mức độ ảnh hưởng']},

    const form=document.getElementById('surveyForm'),body=document.getElementById('surveyBody'),nav=document.getElementById('stepNav'),title=document.getElementById('sectionTitle'),description=document.getElementById('sectionDescription'),chip=document.getElementById('stepChip'),progress=document.getElementById('progressBar'),back=document.getElementById('backButton'),next=document.getElementById('nextButton'),reset=document.getElementById('resetButton'),saveState=document.getElementById('saveState'),toast=document.getElementById('toast');
    const storageKey='feline-leadership-survey-v1'; let step=0,timer,firstRender=true;

    function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]))}
    function showToast(message){clearTimeout(timer);toast.textContent=message;toast.classList.add('show');timer=setTimeout(()=>toast.classList.remove('show'),2300)}
    function saved(){try{return JSON.parse(localStorage.getItem(storageKey)||'{}')}catch{return {}}}

    function optionMarkup(q,option,index){const tuple=Array.isArray(option)?option:[option,option,''];const [value,label,copy]=tuple;const id=`${q.id}-${index}`;return `<div class="choice"><input type="${q.type==='multi'?'checkbox':'radio'}" id="${id}" name="${q.id}" value="${esc(value)}"><label for="${id}"><span class="choice-title">${esc(label)}</span>${copy?`<span class="choice-copy">${esc(copy)}</span>`:''}</label></div>`}
    function questionMarkup(q){
      if(q.type==='fields')return `<div class="question"><div class="field-grid">${q.fields.map(([id,label,placeholder,required,type='text'])=>`<div class="field-wrap"><label for="${id}">${label}${required?' <span class="required">*</span>':''}</label><input class="field" id="${id}" name="${id}" type="${type}" placeholder="${placeholder}" ${required?'required':''}></div>`).join('')}</div></div>`;
      if(q.type==='text'||q.type==='textarea')return `<div class="question"><h3>${q.title}</h3>${q.help?`<p class="help">${q.help}</p>`:''}${q.type==='textarea'?`<textarea class="field" name="${q.id}" rows="4" placeholder="${q.placeholder||''}"></textarea>`:`<input class="field" name="${q.id}" placeholder="${q.placeholder||''}">`}</div>`;
      if(q.type==='scenario')return `<div class="scenario question"><h3 class="scenario-title">${q.title}</h3><p class="scenario-context">${q.context}</p><div class="choices">${q.options.map((o,i)=>optionMarkup({...q,type:'single'},o,i)).join('')}</div><input class="field scenario-note" name="${q.id}Note" placeholder="Ghi chú ngắn nếu cần"></div>`;
      return `<div class="question"><h3>${q.title}</h3>${q.help?`<p class="help">${q.help}${q.max?` <span class="limit">Tối đa ${q.max} lựa chọn.</span>`:''}</p>`:''}<div class="choices ${q.options.length<=5?'compact':''}">${q.options.map((o,i)=>optionMarkup(q,o,i)).join('')}</div></div>`;

    function restoreVisible(){const d=saved();body.querySelectorAll('input,textarea').forEach(input=>{const v=d[input.name];if(input.type==='checkbox'||input.type==='radio')input.checked=Array.isArray(v)?v.includes(input.value):v===input.value;else if(v!==undefined)input.value=v});if(!document.getElementById('answerDate')?.value&&document.getElementById('answerDate'))document.getElementById('answerDate').value=new Date().toISOString().slice(0,10)}

    function renderReview(){const d=saved(),count=answeredCount();const groups=sections.filter(s=>!s.review).map(s=>{const rows=s.questions.flatMap(q=>{if(q.type==='fields')return q.fields.flatMap(([id,label])=>d[id]?[`<li><span class="mark">✓</span><span><strong>${label}:</strong> ${esc(d[id])}</span></li>`]:[]);const v=d[q.id];if(!v)return[];return [`<li><span class="mark">✓</span><span><strong>${q.title||q.id}:</strong> ${esc(Array.isArray(v)?v.join('; '):v)}</span></li>`]}).join('');return `<div class="review-block"><h3>${s.title}</h3>${rows?`<ul class="review-list">${rows}</ul>`:'<p class="help">Chưa có câu trả lời.</p>'}</div>`}).join('');body.innerHTML=`<div class="completion"><strong>Mức độ hoàn thành</strong><span>${count.answered} / ${count.total} nhóm câu hỏi</span></div><div class="review">${groups}</div><div class="question"><h3>Điều CEO AI cần hiểu thêm về cách sếp điều hành</h3><textarea class="field" name="finalLeadershipNotes" rows="5" placeholder="Không bắt buộc. Có thể ghi một vài lưu ý cuối..."></textarea></div><div class="notice"><svg viewBox="0 0 24 24" fill="none"><path d="M12 8.5v4.2M12 16.2h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7"/></svg><div><strong>Kết quả chưa tự gửi lên hệ thống</strong>Hãy tải file hoặc sao chép kết quả rồi gửi cho người phụ trách dự án.</div></div>`;restoreVisible()}

    function flattenAnswers(){const d=values(),lines=[];sections.filter(s=>!s.review).forEach(s=>{lines.push(`## ${s.title}`);s.questions.forEach(q=>{if(q.type==='fields')q.fields.forEach(([id,label])=>lines.push(`- **${label}:** ${d[id]||'Chưa trả lời'}`));else{const v=d[q.id];lines.push(`- **${q.title||q.id}:** ${Array.isArray(v)?v.join('; '):(v||'Chưa trả lời')}`);if(q.type==='scenario'&&d[`${q.id}Note`])lines.push(`  - Ghi chú: ${d[`${q.id}Note`]}`)}});lines.push('')});lines.push('## Ghi chú cuối');lines.push(d.finalLeadershipNotes||'Không có.');return `# Khảo sát phong cách điều hành cho CEO AI\n\n**Ngày xuất:** ${new Date().toLocaleDateString('vi-VN')}\n\n${lines.join('\n')}\n\n---\nCác câu trả lời mô tả xu hướng điều hành để tham khảo, không tự tạo quyền phê duyệt hoặc quy định hệ thống.\n`}
    function download(){persist();const content=flattenAnswers(),d=values(),name=(d.leaderName||'Lanh_dao').replace(/[^a-zA-Z0-9À-ỹ_-]+/g,'_'),blob=new Blob([content],{type:'text/markdown;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`Khao_sat_dieu_hanh_${name}.md`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);showToast('Đã tải kết quả khảo sát')}
    back.addEventListener('click',()=>go(step-1));next.addEventListener('click',()=>step===sections.length-1?download():go(step+1));reset.addEventListener('click',()=>{if(!confirm('Xóa toàn bộ câu trả lời trên thiết bị này?'))return;localStorage.removeItem(storageKey);step=0;render();showToast('Đã làm mới khảo sát')});form.addEventListener('submit',e=>e.preventDefault());const requestedStep=Number(new URLSearchParams(location.search).get('step'));step=Number.isInteger(requestedStep)&&requestedStep>=0&&requestedStep<sections.length?requestedStep:0;render();
  </script>
